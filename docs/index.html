<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Săn Vé Rẻ</title>
<meta name="description" content="Quét giá mọi hãng bay, tìm chuyến rẻ nhất từng chặng trong tuần.">
<meta property="og:title" content="Săn Vé Rẻ">
<meta property="og:description" content="Quét giá mọi hãng bay, tìm chuyến rẻ nhất từng chặng trong tuần.">
<link rel="icon" href="icon48.png">
<style>
  :root {
    color-scheme: light;
    --page: #f3f3f1; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e4e3df; --grid: #ecebe7;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7c7b76;
    --accent: #2a78d6; --accent-soft: #e6effb;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --other: #8a8984;
    --good: #0f7b3e; --good-bg: #e3f4ea; --bad: #b42318; --bad-bg: #fdecea;
    --seq-0: #cde2fb; --seq-1: #9ec5f4; --seq-2: #6da7ec; --seq-3: #3987e5; --seq-4: #256abf; --seq-5: #184f95;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121211; --surface: #1a1a19; --surface-2: #242422; --line: #2e2e2b; --grid: #262624;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
      --accent: #3987e5; --accent-soft: #1b2b42;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --other: #77766f;
      --good: #4ade80; --good-bg: #15301f; --bad: #f87171; --bad-bg: #3a1716;
      --seq-0: #104281; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --surface-2: #242422; --line: #2e2e2b; --grid: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2b42;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #77766f;
    --good: #4ade80; --good-bg: #15301f; --bad: #f87171; --bad-bg: #3a1716;
    --seq-0: #104281; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--text); font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 86%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 12px; padding-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 17px; }
  .live { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live.on i { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
  .live.scan i { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .live.off i { background: var(--bad); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
  .grow { flex: 1; }
  .ibtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 34px; padding: 0 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .ibtn:hover { color: var(--text); border-color: var(--accent); }
  .upd { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .progress { height: 3px; background: transparent; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  section { margin-top: 22px; }
  h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -.1px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .hero { grid-column: 1 / -1; } }
  .kpi { padding: 16px 18px; }
  .kpi .lb { color: var(--text-2); font-size: 12px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.6px; margin-top: 2px; }
  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hero { position: relative; overflow: hidden; cursor: pointer; }
  .hero .v { font-size: 40px; letter-spacing: -1.2px; line-height: 1.15; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--text-2); margin-top: 6px; }
  .hero::after { content: "✈"; position: absolute; right: -6px; bottom: -28px; font-size: 130px; color: var(--accent); opacity: .07; transform: rotate(-12deg); }

  /* Airline chip */
  .al { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; color: var(--text); white-space: nowrap; }
  .al::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.down { color: var(--good); background: var(--good-bg); }
  .pill.up { color: var(--bad); background: var(--bad-bg); }
  .pill.flat { color: var(--text-2); background: var(--surface-2); }

  /* Route cards */
  .routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rc { padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .rc:hover { border-color: var(--accent); transform: translateY(-1px); }
  .rc.best { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
  .rc .hd { display: flex; align-items: center; gap: 8px; }
  .rc .sw { width: 12px; height: 3px; border-radius: 2px; background: var(--c); }
  .rc .code { font-weight: 700; font-size: 15px; }
  .rc .tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .rc .nm { color: var(--muted); font-size: 12px; }
  .rc .pr { font-size: 24px; font-weight: 700; letter-spacing: -.5px; margin: 8px 0 2px; }
  .rc .fl { color: var(--text-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .rc .ft { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }

  /* Chart */
  .chartcard { padding: 14px 16px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 6px; }
  .legend button { border: 0; background: none; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
  .legend button i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
  .legend button.off { opacity: .4; }
  #chart { position: relative; }
  #chart svg { display: block; width: 100%; overflow: visible; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .gridl { stroke: var(--grid); }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); min-width: 160px; opacity: 0; transition: opacity .1s; }
  .tip.show { opacity: 1; }
  .tip .t { font-weight: 700; margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
  .tip .r i { width: 10px; height: 3px; border-radius: 2px; background: var(--c); }
  .tip .r b { font-weight: 600; }

  /* Heatmap */
  .heat { overflow: auto; }
  .heat table { border-collapse: separate; border-spacing: 2px; width: 100%; padding: 8px; }
  .heat th { font-weight: 500; font-size: 12px; color: var(--text-2); padding: 6px; white-space: nowrap; }
  .heat th.we { color: var(--text); font-weight: 700; }
  .heat th.rh { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .heat th.rh b { color: var(--text); }
  .heat th.rh small { display: block; color: var(--muted); font-weight: 400; }
  .hc { width: 100%; min-width: 74px; height: 54px; border: 0; border-radius: 8px; cursor: pointer; display: grid; place-content: center;
    background: var(--bgc, var(--surface-2)); color: var(--fg, var(--text-2)); position: relative; line-height: 1.2; }
  .hc b { font-size: 14px; }
  .hc small { font-size: 10.5px; opacity: .9; }
  .hc.best { outline: 2px solid var(--text); outline-offset: 1px; }
  .hc.best::after { content: "★"; position: absolute; top: 3px; right: 6px; font-size: 11px; }
  .hc.sel { box-shadow: 0 0 0 3px var(--accent); }
  .hc.pending { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); }
  .scale { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; padding: 0 12px 12px; flex-wrap: wrap; }
  .scale .bar { display: flex; gap: 2px; }
  .scale .bar i { width: 22px; height: 8px; border-radius: 2px; }

  /* Explorer */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .filters select { height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 0 10px; height: 30px; cursor: pointer; color: var(--text-2); font-size: 12.5px; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; }
  .chips button.off { opacity: .45; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  .tbl { overflow: auto; }
  table.fl { border-collapse: collapse; width: 100%; }
  table.fl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  table.fl th.r, table.fl td.r { text-align: right; }
  table.fl th.on { color: var(--text); }
  table.fl td { padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.fl tr:hover td { background: var(--surface-2); }
  table.fl td.p { font-weight: 700; }
  table.fl del { color: var(--muted); font-weight: 400; font-size: 12px; margin-right: 6px; }
  .badge { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
  .more { display: block; margin: 0 auto; padding: 12px; border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; }
  .muted { color: var(--muted); }

  .empty { text-align: center; padding: 70px 20px; }
  .empty .big { font-size: 56px; }
  .empty h1 { font-size: 22px; margin: 10px 0 6px; }
  .empty p { color: var(--text-2); max-width: 560px; margin: 6px auto; }
  .empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 760px; margin: 24px auto 0; text-align: left; }
  .steps .card { padding: 14px; }
  .steps b { display: block; margin-bottom: 4px; }
  .drop { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent);
    display: none; place-items: center; font-size: 20px; font-weight: 700; color: var(--accent); }
  .drop.show { display: grid; }
  .err { color: var(--bad); }
  .kpis > *, .routes > *, .filters > * { min-width: 0; }
  .brand { white-space: nowrap; }
  @media (max-width: 640px) {
    .top .wrap { gap: 8px; }
    .upd, .ibtn .tx { display: none; }
    .ibtn { padding: 0 9px; }
    .live { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
    .hero .v { font-size: 32px; }
    .filters select { flex: 1 1 140px; }
  }

  [hidden] { display: none !important; }
  .wrap.tight { padding-bottom: 0; }
  .ibtn.hl { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; animation: nudge 1.2s ease-in-out 2; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
  .ctl { padding: 14px 16px; margin-top: 18px; display: grid; gap: 12px; }
  .ctl .lbl { color: var(--text-2); font-size: 12px; margin-bottom: 4px; }
  .ctl-routes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rchip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); font-size: 13px; }
  .rchip button { border: 0; background: none; cursor: pointer; color: var(--text-2); font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 50%; }
  .rchip button:hover { color: var(--bad); }
  .ctl-add { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ctl select, .ctl input[type=date], .ctl input[type=number] { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; }
  .ctl select { max-width: 200px; }
  .ctl input[type=number] { width: 72px; }
  .ctl-opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .ctl-opts label.f { display: grid; gap: 4px; color: var(--text-2); font-size: 12px; }
  .ctl-opts label.chk { display: inline-flex; gap: 6px; align-items: center; height: 34px; color: var(--text-2); cursor: pointer; }
  .go { height: 40px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
  .go:hover { filter: brightness(1.08); }
  .go.stop { background: var(--bad); }
  #ctlMsg { color: var(--bad); font-size: 13px; }


  .webban { margin-top: 18px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; border-color: var(--accent); }
  .webban .wb-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; flex: none; }
  .webban .wb-tx { flex: 1 1 320px; display: grid; gap: 2px; color: var(--text-2); }
  .webban .wb-tx b:first-child { color: var(--text); }
  .webban a { text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo">✈</div>Săn Vé Rẻ</div>
    <span class="live" id="live"><i></i><span>Đang tải…</span></span>
    <span class="grow"></span>
    <span class="upd num" id="upd"></span>
    <button class="ibtn" id="btnCsv" title="Tải bảng giá CSV (Excel)">⬇<span class="tx"> CSV</span></button>
    <button class="ibtn" id="btnExport" title="Tải dữ liệu JSON">⬇<span class="tx"> JSON</span></button>
    <button class="ibtn" id="btnImport" title="Mở file JSON đã xuất">📂<span class="tx"> Nhập</span></button>
    <button class="ibtn" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>
<div class="wrap tight" id="webBanner">
  <div class="card webban">
    <div class="wb-ic">✈</div>
    <div class="wb-tx">
      <b>Bản xem trước với dữ liệu mẫu.</b>
      <span>Để quét giá thật, cài extension <b>Săn Vé Rẻ</b> cho Chrome (1 lần, ~30 giây) rồi bấm icon ✈ trên thanh công cụ.</span>
    </div>
    <a class="go wb-btn" href="https://github.com/xoaytrongtruc/san-ve-re/releases/latest/download/san-ve-re-extension.zip">⬇ Tải extension</a>
    <a class="ibtn" href="https://github.com/xoaytrongtruc/san-ve-re#cài-đặt-1-lần-30-giây" target="_blank" rel="noopener">Hướng dẫn</a>
  </div>
</div>

<div class="wrap tight">
  <div class="card ctl">
    <div>
      <div class="lbl">Chặng bay</div>
      <div class="ctl-routes"><span id="routeChips" class="ctl-routes"></span></div>
    </div>
    <div class="ctl-add">
      <select id="selFrom" aria-label="Điểm đi"></select>
      <button class="ibtn" id="swapSel" title="Đảo chiều">⇄</button>
      <select id="selTo" aria-label="Điểm đến"></select>
      <button class="ibtn" id="addRoute">+ Thêm chặng</button>
      <button class="ibtn" id="addReturn" title="Thêm chiều ngược lại cho mọi chặng">↩ Thêm chiều về</button>
    </div>
    <div class="ctl-opts">
      <label class="f">Từ ngày<input type="date" id="c_start"></label>
      <label class="f">Số ngày<input type="number" id="c_days" min="1" max="31"></label>
      <label class="f">Người lớn<input type="number" id="c_pax" min="1" max="9"></label>
      <label class="f" title="Số lượt tìm chạy cùng lúc">Song song<input type="number" id="c_concurrency" min="1" max="6"></label>
      <label class="chk"><input type="checkbox" id="c_cache"> Dùng kết quả &lt; 30 phút</label>
      <span class="grow"></span>
      <span id="ctlMsg"></span>
      <button class="ibtn" id="btnLogin" hidden>🔑 Mở trang đăng nhập</button>
      <button class="go" id="btnRun">🔍 Quét giá</button>
    </div>
  </div>
</div>

<main class="wrap" id="app"></main>
<div class="tip" id="tip"></div>
<div class="drop" id="drop">Thả file JSON vào đây</div>
<script src="page-search.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
